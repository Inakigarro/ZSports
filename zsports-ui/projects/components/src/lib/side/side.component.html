<div class="side-container">
	<div class="main-content" [class.blurred]="expanded()">
		<ng-content select="[main]"></ng-content>
	</div>
	<div class="side-panel" [class.expanded]="expanded()">
		<ng-content select="[side]"></ng-content>
	</div>
	@if (this.expanded() && this.closeOnBackdrop()) {
	<div class="side-backdrop" (click)="onBackdropClick()"></div>
	}
</div>
