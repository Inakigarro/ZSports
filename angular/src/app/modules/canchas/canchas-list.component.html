<app-side
	[expanded]="this.nuevaCanchaOpened"
	[closeOnBackdrop]="true"
	(closed)="this.onBackdropClicked()"
>
	<app-card main [id]="this.id">
		<div card-header>
			<h2>{{ this.title }}</h2>
			<app-button
				[id]="this.nuevaCanchaButton.id"
				[label]="this.nuevaCanchaButton.label"
				[hasIcon]="this.nuevaCanchaButton.icon !== undefined"
				[icon]="this.nuevaCanchaButton.icon"
				[type]="this.nuevaCanchaButton.type!"
				[disabled]="false"
				(onClick)="this.onNuevaCanchaButtonClicked()"
			/>
		</div>
		<div card-body>
			@if (this.canchasLoading$ | async) {
			<div class="spinner-overlay">
				<div class="spinner"></div>
			</div>
			}
			<app-list [id]="this.id" [columns]="this.columns" [data]="this.data" />
		</div>
	</app-card>
	@if (this.nuevaCanchaOpened) {
	<app-nueva-cancha side (onClose)="this.onBackdropClicked()">
	</app-nueva-cancha>
	}
</app-side>
